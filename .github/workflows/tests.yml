name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install without optional Azure SDK
        run: python -m pip install -e .
      - name: Test offline analyzer and probe safety
        run: python -m unittest discover -s tests -v
      - name: Run compliant fixture
        run: az-private-ready assess tests/fixtures/compliant.json --format json
      - name: Verify non-compliant fixture fails
        run: |
          set +e
          az-private-ready assess tests/fixtures/broken.json --output /tmp/report.md
          rc=$?
          test "$rc" -eq 2
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile subscription Bicep with Azure CLI
        uses: azure/cli@v2
        with:
          inlineScript: az bicep build --file infra/main.bicep
