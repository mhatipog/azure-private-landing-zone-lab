[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-private-readiness"
version = "0.1.0"
description = "Evidence-based Azure private landing zone readiness checks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Community contributors"}]
keywords = ["azure", "private-endpoint", "landing-zone", "network-security", "bicep", "devsecops"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Topic :: System :: Systems Administration"]

[project.scripts]
az-private-ready = "az_ready.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
